# SPDX-License-Identifier: Apache-2.0
name: Release

# Publishes a release of the code: a tag and its notes, nothing else.
#
# No binary is built, signed or attached here. Binaries are built and shipped
# elsewhere, from the published release: the studio's publishing pipeline
# watches this repository's releases, checks the code out at the release tag
# and takes it to the stores from there. This repository holds no store
# credential and no signing credential; the only secret this workflow uses is
# the GITHUB_TOKEN that GitHub issues to every run.
#
# To release: update RELEASE_NOTES.md and the version numbers, merge, then push
# the tag (docs/release-checklist.md).

on:
  push:
    tags:
      - 'v*'

# Write permission is needed to create the GitHub release. Nothing else is granted.
permissions:
  contents: write

jobs:
  # ── Checks on the code at the tag ────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Smoke check
        run: bash scripts/smoke-check.sh
      # `tauri build` refuses a Tauri crate and npm package on different
      # major.minor releases. Failing here, in seconds, keeps a tag that cannot
      # be built from being published as a release.
      - name: Tauri crate and npm package versions match
        run: bash scripts/check-tauri-versions.sh
      - name: Check docs freshness
        env:
          # Pass the tag through the environment rather than interpolating the
          # ${{ }} expression straight into the script: a tag name can legally
          # contain shell metacharacters that would otherwise be evaluated here.
          TAG: ${{ github.ref_name }}
        run: |
          # Strip any pre-release suffix so v0.2.2-beta.1 verifies against the
          # v0.2.2 base version.
          VERSION="${TAG%%-*}"
          bash scripts/check-docs-freshness.sh "$VERSION"

  # ── Publish GitHub release ────────────────────────────────────────────────────
  release:
    name: Publish release notes
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # NO binaries are attached to GitHub releases. Conversation Simulator ships
      # prebuilt binaries through its stores only; the other supported path is
      # building from source at a release tag. A GitHub release is therefore a
      # changelog and a tag — there is nothing to download.
      - name: Resolve release metadata
        id: relmeta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Pre-release iff the tag carries a semver pre-release suffix (a hyphen).
          if [[ "$TAG" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi

          # Creating a release in the GitHub UI pushes the tag (triggering this
          # workflow) once the release row already exists, so a hand-authored
          # title/body is already live. Preserve it by passing empty name/body.
          if gh release view "$TAG" >/dev/null 2>&1; then EXISTS=true; else EXISTS=false; fi

          if [[ "$PRERELEASE" == false ]]; then MAKE_LATEST=true; else MAKE_LATEST=false; fi

          if [[ "$EXISTS" == true ]]; then
            NAME=""
            BODY_PATH=""
          else
            NAME="Conversation Simulator $TAG"
            # Publish this tag's own section of RELEASE_NOTES.md: the lines
            # under "# Conversation Simulator <tag> — Release Notes" up to the
            # next version heading, without the heading itself (the release
            # name carries it) and without the rule that separates sections.
            NOTES="$RUNNER_TEMP/release-notes.md"
            awk -v header="# Conversation Simulator $TAG — Release Notes" '
              $0 == header { found = 1; next }
              found && /^# Conversation Simulator v/ { exit }
              found { lines[++n] = $0 }
              END {
                while (n > 0 && (lines[n] ~ /^[[:space:]]*$/ || lines[n] == "---")) n--
                start = 1
                while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
                for (i = start; i <= n; i++) print lines[i]
              }
            ' RELEASE_NOTES.md > "$NOTES"
            if grep -q '[^[:space:]]' "$NOTES"; then
              BODY_PATH="$NOTES"
            else
              echo "::warning::RELEASE_NOTES.md has no section for $TAG; publishing the template. Edit the release body by hand."
              BODY_PATH="docs/release-notes-template.md"
            fi
          fi

          {
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
            echo "name=$NAME"
            echo "body_path=$BODY_PATH"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved: tag=$TAG prerelease=$PRERELEASE make_latest=$MAKE_LATEST exists=$EXISTS"

      # No `files:` key — this publishes notes, never artifacts.
      - name: Publish release notes (no binaries)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.relmeta.outputs.tag }}
          name: ${{ steps.relmeta.outputs.name }}
          body_path: ${{ steps.relmeta.outputs.body_path }}
          draft: false
          prerelease: ${{ steps.relmeta.outputs.prerelease }}
          make_latest: ${{ steps.relmeta.outputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
